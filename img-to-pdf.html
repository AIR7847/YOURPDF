<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image → PDF – PDF Toolkit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b1220; --card:#0f172a; --muted:#94a3b8;
  --text:#e5e7eb; --accent:#22c55e; --border:#1f2937;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(180deg,#0b1220,#020617);
  color:var(--text);
}
header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
}
header .wrap{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:12px;
  align-items:center;
}
nav{margin-left:auto}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--text)}
main{
  max-width:900px;
  margin:28px auto;
  padding:0 20px;
}
.card{
  background:linear-gradient(180deg,#0f172a,#020617);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}
h1{margin:0 0 8px;font-size:1.3rem}
p{margin:0;color:var(--muted)}
input,select,button{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  margin-top:10px;
}
button.primary{
  background:linear-gradient(135deg,var(--accent),#16a34a);
  border:none;
  color:#052e16;
  font-weight:800;
  cursor:pointer;
}
.status{margin-top:12px;color:var(--muted)}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <strong>PDF Toolkit</strong>
    <nav>
      <a href="index.html">Home</a> |
      <a href="pdf-to-jpg.html">PDF → JPG</a>
    </nav>
  </div>
</header>

<main>
  <div class="card">
    <h1>Image → PDF</h1>
    <p>Convert JPG / PNG images into a single PDF.</p>

    <input type="file" id="files" accept="image/jpeg,image/png" multiple>

    <select id="pagesize">
      <option value="auto">Auto (image size)</option>
      <option value="a4">A4</option>
    </select>

    <button class="primary" onclick="convert()">Create PDF</button>

    <div id="msg" class="status"></div>
  </div>
</main>
<script src="pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;
const A4_W = 595.28, A4_H = 841.89;

// Load + resize image safely
function loadImageAsJpg(file, maxW = 1600) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width;
      let h = img.height;

      if (w > maxW) {
        h = Math.round(h * (maxW / w));
        w = maxW;
      }

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
      resolve(dataUrl);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function convert(){
  const files = [...document.getElementById("files").files];
  if(files.length === 0){
    alert("Select images");
    return;
  }

  const pageSize = document.getElementById("pagesize").value;
  const msg = document.getElementById("msg");
  msg.textContent = "Preparing images…";

  const pdf = await PDFDocument.create();

  for(let i = 0; i < files.length; i++){
    msg.textContent = `Processing image ${i + 1} / ${files.length}`;

    // ✅ Load image safely
    const dataUrl = await loadImageAsJpg(files[i]);
    const img = await pdf.embedJpg(dataUrl);

    let page, w, h;

    if(pageSize === "a4"){
      w = A4_W;
      h = A4_H;
      page = pdf.addPage([w, h]);

      const scale = Math.min(w / img.width, h / img.height);
      const iw = img.width * scale;
      const ih = img.height * scale;

      page.drawImage(img, {
        x: (w - iw) / 2,
        y: (h - ih) / 2,
        width: iw,
        height: ih
      });
    } else {
      page = pdf.addPage([img.width, img.height]);
      page.drawImage(img, {
        x: 0,
        y: 0,
        width: img.width,
        height: img.height
      });
    }
  }

  msg.textContent = "Saving PDF…";
  const bytes = await pdf.save();

  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  msg.innerHTML = `
    Done ✅<br>
    <label>Rename (optional)</label>
    <input id="rename" placeholder="images.pdf" style="margin-top:6px">
    <button class="primary" id="dl" style="margin-top:8px">Download PDF</button>
  `;

  document.getElementById("dl").onclick = () => {
    let name = document.getElementById("rename").value.trim();
    if(!name) name = "images.pdf";
    if(!name.toLowerCase().endsWith(".pdf")) name += ".pdf";
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
  };
}
</script>
</body>
</html>
