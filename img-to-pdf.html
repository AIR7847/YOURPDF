<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image to PDF – YOURPDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#475569;
  --bg:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{padding:24px 20px}
.header-box{
  max-width:900px;
  margin:auto;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:16px;
  text-align:center;
  background:#f8fafc;
}
.header-box h1{margin:0;font-size:1.6rem;font-weight:800}
.header-box p{margin:6px 0 0;color:var(--muted);font-size:.95rem}

/* MAIN */
main{max-width:900px;margin:28px auto;padding:0 20px}

/* UPLOAD */
.upload-box{
  border:none;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  cursor:pointer;
  background:#ffffff;
}
.upload-box,*{
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.upload-plus{
  width:52px;height:52px;margin:0 auto 10px;
  border-radius:50%;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}
  70%{box-shadow:0 0 0 14px rgba(37,99,235,0)}
  100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}
.upload-text{font-weight:600}
.upload-sub{font-size:.9rem;color:var(--muted)}
input[type=file]{display:none}

/* PREVIEW GRID */
.preview-grid{
  margin-top:18px;
  display:none;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;
  justify-items:center;
}
.preview-item{text-align:center}
.preview-item img{
  width:100px;
  border:1px solid var(--border);
  border-radius:8px;
}
.preview-name{
  margin-top:6px;
  font-size:.85rem;
  color:var(--muted);
  word-break:break-all;
}

/* CONTROLS */
.controls{margin-top:22px}
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:700;
}
.status{margin-top:14px;color:var(--muted)}
</style>
</head>

<body>

<header>
  <div class="header-box">
    <h1>Image to PDF</h1>
    <p>Convert multiple images into a single PDF</p>
  </div>
</header>

<main>

<label class="upload-box">
  <div class="upload-plus">+</div>
  <div class="upload-text">Choose images</div>
  <div class="upload-sub">JPG / PNG supported</div>
  <input type="file" id="files" accept="image/*" multiple>
</label>

<div class="preview-grid" id="previewGrid"></div>

<div class="controls">
  <button onclick="createPdf()">Create PDF</button>
</div>

<div id="msg" class="status"></div>

</main>

<script src="pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;

const filesInput = document.getElementById("files");
const grid = document.getElementById("previewGrid");

filesInput.addEventListener("change", ()=>{
  grid.innerHTML="";
  grid.style.display="grid";

  [...filesInput.files].forEach(f=>{
    const item=document.createElement("div");
    item.className="preview-item";

    const img=document.createElement("img");
    img.src=URL.createObjectURL(f);

    const name=document.createElement("div");
    name.className="preview-name";
    name.textContent=f.name;

    item.appendChild(img);
    item.appendChild(name);
    grid.appendChild(item);
  });
});

async function createPdf(){
  const files=[...filesInput.files];
  if(files.length===0){alert("Select images");return;}

  const msg=document.getElementById("msg");
  msg.textContent="Creating PDF…";

  const pdf=await PDFDocument.create();

  for(const f of files){
    const bytes=await f.arrayBuffer();
    const img = f.type.includes("png")
      ? await pdf.embedPng(bytes)
      : await pdf.embedJpg(bytes);

    const page = pdf.addPage([img.width, img.height]);
    page.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
  }

  const out = await pdf.save();
  const blob=new Blob([out],{type:"application/pdf"});
  const url=URL.createObjectURL(blob);

  msg.innerHTML=`Done ✅<br>
    <input id="rename" value="images"
      style="margin-top:6px;padding:10px;width:100%;
      border:1px solid var(--border);border-radius:10px">
    <button id="dl"
      style="margin-top:10px;width:100%;
      padding:12px;border-radius:12px;
      background:var(--primary);color:#fff;
      border:none;font-weight:700">
      Download PDF
    </button>`;

  dl.onclick=()=>{
    let n=rename.value.trim()||"images";
    if(!n.endsWith(".pdf")) n+=".pdf";
    const a=document.createElement("a");
    a.href=url;
    a.download=n;
    a.click();
  };
}
</script>

</body>
</html>
