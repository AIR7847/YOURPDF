<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF to JPG – YOURPDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#475569;
  --bg:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{padding:24px 20px}
.header-box{
  max-width:900px;
  margin:auto;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:16px;
  text-align:center;
  background:#f8fafc;
}
.header-box h1{margin:0;font-size:1.6rem;font-weight:800}
.header-box p{margin:6px 0 0;color:var(--muted);font-size:.95rem}

/* MAIN */
main{max-width:900px;margin:28px auto;padding:0 20px}

/* UPLOAD */
.upload-box{
  border:none;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  cursor:pointer;
  background:#ffffff;
}
.upload-box,*{
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.upload-plus{
  width:52px;height:52px;margin:0 auto 10px;
  border-radius:50%;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}
  70%{box-shadow:0 0 0 14px rgba(37,99,235,0)}
  100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}
.upload-text{font-weight:600}
.upload-sub{font-size:.9rem;color:var(--muted)}
input[type=file]{display:none}

/* PREVIEW */
.preview{
  margin-top:18px;
  display:none;
  text-align:center;
}
.preview canvas{
  width:110px;
  border:1px solid var(--border);
  border-radius:8px;
}
.preview-name{
  margin-top:6px;
  font-size:.85rem;
  color:var(--muted);
  word-break:break-all;
}

/* CONTROLS */
.controls{margin-top:22px}
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:700;
}
.status{margin-top:14px;color:var(--muted)}
</style>
</head>

<body>

<header>
  <div class="header-box">
    <h1>PDF to JPG</h1>
    <p>Convert each PDF page into JPG images</p>
  </div>
</header>

<main>

<label class="upload-box">
  <div class="upload-plus">+</div>
  <div class="upload-text">Choose PDF file</div>
  <div class="upload-sub">Click to select from device</div>
  <input type="file" id="file" accept="application/pdf">
</label>

<div class="preview" id="preview">
  <canvas id="previewCanvas"></canvas>
  <div class="preview-name" id="previewName"></div>
</div>

<div class="controls">
  <button onclick="convert()">Convert to JPG</button>
</div>

<div id="msg" class="status"></div>

</main>

<script src="pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";

const fileInput = document.getElementById("file");
const previewBox = document.getElementById("preview");
const canvas = document.getElementById("previewCanvas");
const ctx = canvas.getContext("2d");
const nameEl = document.getElementById("previewName");

fileInput.addEventListener("change", async ()=>{
  const f = fileInput.files[0];
  if(!f) return;
  nameEl.textContent = f.name;
  previewBox.style.display="block";
  const pdf = await pdfjsLib.getDocument(URL.createObjectURL(f)).promise;
  const page = await pdf.getPage(1);
  const vp = page.getViewport({ scale:0.22 });
  canvas.width = vp.width;
  canvas.height = vp.height;
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
});
</script>

<script>
async function convert(){
  const file = fileInput.files[0];
  if(!file){ alert("Select a PDF"); return; }

  const msg = document.getElementById("msg");
  msg.textContent = "Rendering pages…";

  const pdf = await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;

  for(let i=1;i<=pdf.numPages;i++){
    msg.textContent = `Rendering page ${i} / ${pdf.numPages}`;
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale:1.5 });
    const c = document.createElement("canvas");
    const cx = c.getContext("2d");
    c.width = vp.width;
    c.height = vp.height;
    await page.render({ canvasContext:cx, viewport:vp }).promise;

    c.toBlob(blob=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `page-${i}.jpg`;
      a.click();
    },"image/jpeg",0.95);
  }

  msg.textContent = "Done ✅ (All pages downloaded)";
}
</script>

</body>
</html>
