<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Split PDF – PDF Toolkit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b1220;
  --card:#0f172a;
  --muted:#94a3b8;
  --text:#e5e7eb;
  --accent:#22c55e;
  --border:#1f2937;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(180deg,#0b1220,#020617);
  color:var(--text);
}
header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
}
header .wrap{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}
nav{margin-left:auto}
nav a{
  color:var(--muted);
  text-decoration:none;
}
nav a:hover{color:var(--text)}
main{
  max-width:900px;
  margin:28px auto;
  padding:0 20px;
}
.card{
  background:linear-gradient(180deg,#0f172a,#020617);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}
h1{margin:0 0 8px;font-size:1.3rem}
p{margin:0;color:var(--muted)}
input,select,button{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  margin-top:10px;
}
button.primary{
  background:linear-gradient(135deg,var(--accent),#16a34a);
  border:none;
  color:#052e16;
  font-weight:800;
  cursor:pointer;
}
.status{
  margin-top:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <strong>PDF Toolkit</strong>
    <nav>
      <a href="index.html">N-Up</a> |
      <a href="rotate.html">Rotate</a> |
      <a href="merge.html">Merge</a>
    </nav>
  </div>
</header>

<main>
  <div class="card">
    <h1>Split PDF</h1>
    <p>Split PDF into single pages or a selected range.</p>

    <input type="file" id="file" accept="application/pdf">

    <select id="mode">
      <option value="each">Split every page</option>
      <option value="range">Split selected range</option>
    </select>

    <input id="range" placeholder="Page range (e.g. 2-5)">

    <button class="primary" onclick="splitPdf()">Split PDF</button>

    <div id="msg" class="status"></div>
  </div>
</main>

<script src="pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;

async function splitPdf(){
  const file = document.getElementById("file").files[0];
  if(!file){
    alert("Select a PDF");
    return;
  }

  const mode = document.getElementById("mode").value;
  const rangeText = document.getElementById("range").value.trim();
  const msg = document.getElementById("msg");

  msg.textContent = "Processing…";

  const buffer = await file.arrayBuffer();
  const src = await PDFDocument.load(buffer, { ignoreEncryption: true });
  const pages = src.getPages();

  if(mode === "each"){
    for(let i = 0; i < pages.length; i++){
      const out = await PDFDocument.create();
      const [p] = await out.copyPages(src, [i]);
      out.addPage(p);

      const bytes = await out.save();
      download(bytes, `page-${i+1}.pdf`);
    }
    msg.textContent = "Done ✅ (Downloaded all pages)";
  }

  else if(mode === "range" && rangeText.includes("-")){
    const [a,b] = rangeText.split("-").map(x => parseInt(x) - 1);
    const out = await PDFDocument.create();
    const indexes = pages.map((_,i)=>i).filter(i=>i>=a && i<=b);
    const copied = await out.copyPages(src, indexes);
    copied.forEach(p=>out.addPage(p));

    const bytes = await out.save();
    download(bytes, "split-range.pdf");
    msg.textContent = "Done ✅";
  }
}

function download(bytes, name){
  const blob = new Blob([bytes], { type: "application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}
</script>

</body>
</html>
