<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>N-Up Print – YOURPDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#475569;
  --bg:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER BOX */
header{
  padding:24px 20px;
}
.header-box{
  max-width:900px;
  margin:auto;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:16px;
  text-align:center;
  background:#f8fafc;
}
.header-box h1{
  margin:0;
  font-size:1.6rem;
  font-weight:800;
}
.header-box p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:.95rem;
}

/* MAIN */
main{
  max-width:900px;
  margin:28px auto;
  padding:0 20px;
}

/* UPLOAD BOX */
.upload-box{
  border:2px dashed var(--border);
  border-radius:18px;
  padding:36px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s ease;
  background:#ffffff;
}
.upload-box:hover{
  border-color:var(--primary);
  background:#f8fafc;
}
.upload-plus{
  width:56px;
  height:56px;
  margin:0 auto 12px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}
  70%{box-shadow:0 0 0 14px rgba(37,99,235,0)}
  100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}
.upload-text{
  font-weight:600;
}
.upload-sub{
  font-size:.9rem;
  color:var(--muted);
  margin-top:4px;
}

/* CONTROLS */
.controls{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:.95rem;
}
button{
  background:var(--primary);
  color:#fff;
  border:none;
  font-weight:700;
  cursor:pointer;
}
button:hover{opacity:.95}

/* STATUS */
.status{
  margin-top:14px;
  color:var(--muted);
}

/* HIDE REAL FILE INPUT */
input[type=file]{display:none}
</style>
</head>

<body>

<header>
  <div class="header-box">
    <h1>N-Up Print</h1>
    <p>Print multiple PDF pages on a single A4 sheet</p>
  </div>
</header>

<main>

  <!-- UPLOAD -->
  <label class="upload-box">
    <div class="upload-plus">+</div>
    <div class="upload-text">Choose PDF file</div>
    <div class="upload-sub">Click to select from device</div>
    <input type="file" id="file" accept="application/pdf">
  </label>

  <!-- CONTROLS -->
  <div class="controls">
    <select id="layout">
      <option value="2x2">2 × 2 (4 pages)</option>
      <option value="2x3">2 × 3 (6 pages)</option>
      <option value="3x3" selected>3 × 3 (9 pages)</option>
      <option value="3x4">3 × 4 (12 pages)</option>
      <option value="4x4">4 × 4 (16 pages)</option>
    </select>

    <button onclick="runNup()">Create PDF</button>
  </div>

  <div id="msg" class="status"></div>

</main>

<script src="pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;
const A4W = 595.28, A4H = 841.89;

async function runNup(){
  const f = document.getElementById('file').files[0];
  if(!f){ alert('Select a PDF'); return; }

  const layout = document.getElementById('layout').value;
  const [cols, rows] = layout.split('x').map(Number);
  const cellW = A4W / cols, cellH = A4H / rows;

  const msg = document.getElementById('msg');
  msg.textContent = 'Processing…';

  const src = await PDFDocument.load(await f.arrayBuffer());
  const out = await PDFDocument.create();
  const pages = src.getPages();
  let i = 0;

  while(i < pages.length){
    const page = out.addPage([A4W, A4H]);
    const slice = pages.slice(i, i + cols * rows);
    const embeds = await out.embedPages(slice);

    embeds.forEach((ep, k) => {
      const scale = Math.min(cellW / ep.width, cellH / ep.height);
      const col = k % cols;
      const row = (rows - 1) - Math.floor(k / cols);

      page.drawPage(ep, {
        x: col * cellW,
        y: row * cellH,
        xScale: scale,
        yScale: scale
      });
    });

    i += slice.length;
  }

  const bytes = await out.save();
  const blob = new Blob([bytes], { type:'application/pdf' });
  const url = URL.createObjectURL(blob);

  /* 🔥 DEFAULT NAME = ORIGINAL FILE NAME */
  const originalName = f.name.replace(/\.pdf$/i, "");

  msg.innerHTML = `
    Done ✅<br>
    <label>Rename (optional)</label>
    <input id="rename"
           value="${originalName}-${layout}"
           style="margin-top:6px;padding:10px;width:100%;
                  border:1px solid var(--border);border-radius:10px">
    <button id="dl"
            style="margin-top:10px;width:100%;padding:12px;
                   border-radius:12px;background:var(--primary);
                   color:#fff;border:none;font-weight:700">
      Download PDF
    </button>
  `;

  document.getElementById('dl').onclick = () => {
    let name = document.getElementById('rename').value.trim();
    if(!name) name = `${originalName}-${layout}`;
    if(!name.toLowerCase().endsWith('.pdf')) name += '.pdf';

    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
  };
}
</script>

</body>
</html>
