<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge PDFs – YOURPDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb; --border:#e5e7eb; --text:#0f172a;
  --muted:#475569; --bg:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
header{padding:24px 20px}
.header-box{max-width:900px;margin:auto;padding:18px 20px;border:1px solid var(--border);
  border-radius:16px;text-align:center;background:#f8fafc}
.header-box h1{margin:0;font-size:1.6rem;font-weight:800}
.header-box p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
main{max-width:900px;margin:28px auto;padding:0 20px}

/* upload */
.upload-box{border:none;border-radius:18px;padding:30px 20px;text-align:center;cursor:pointer}
.upload-box,*{user-select:none;-webkit-tap-highlight-color:transparent}
.upload-plus{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;
  background:var(--primary);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:32px;animation:pulse 1.8s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}
  70%{box-shadow:0 0 0 14px rgba(37,99,235,0)}
  100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}
.upload-text{font-weight:600}
.upload-sub{font-size:.9rem;color:var(--muted)}
input[type=file]{display:none}
/* preview grid (CENTERED) */
.preview-list{
  margin-top:18px;
  display:none;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
  gap:14px;
  justify-items:center;
}

.preview-item{
  text-align:center;
}

.preview-item canvas{
  width:90px;
  border:1px solid var(--border);
  border-radius:8px;
}

.preview-name{
  margin-top:6px;
  font-size:.85rem;
  color:var(--muted);
  word-break:break-all;
}
/* controls */
.controls{margin-top:22px;display:grid;grid-template-columns:1fr}
button{width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--primary);color:#fff;font-weight:700}
.status{margin-top:14px;color:var(--muted)}
</style>
</head>

<body>

<header>
  <div class="header-box">
    <h1>Merge PDFs</h1>
    <p>Select multiple PDFs. They will be merged in the same order.</p>
  </div>
</header>

<main>

<label class="upload-box">
  <div class="upload-plus">+</div>
  <div class="upload-text">Choose PDF files</div>
  <div class="upload-sub">Select two or more PDFs</div>
  <input type="file" id="files" accept="application/pdf" multiple>
</label>

<!-- preview -->
<div class="preview-list" id="previewList"></div>

<div class="controls">
  <button onclick="mergePdfs()">Merge PDFs</button>
</div>

<div id="msg" class="status"></div>

</main>

<script src="pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
const filesInput=document.getElementById("files");
const list=document.getElementById("previewList");

filesInput.addEventListener("change", async ()=>{
  list.innerHTML=""; list.style.display="block";
  for(const f of filesInput.files){
    const row=document.createElement("div");row.className="preview-item";
    const c=document.createElement("canvas");const ctx=c.getContext("2d");
    const name=document.createElement("div");name.className="preview-name";name.textContent=f.name;
    row.appendChild(c);row.appendChild(name);list.appendChild(row);

    const pdf=await pdfjsLib.getDocument(URL.createObjectURL(f)).promise;
    const page=await pdf.getPage(1);
    const vp=page.getViewport({scale:.18});
    c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:ctx,viewport:vp}).promise;
  }
});
</script>

<script src="pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;
async function mergePdfs(){
  const files=[...filesInput.files];
  if(files.length<2){alert("Select at least 2 PDFs");return;}
  const msg=document.getElementById("msg"); msg.textContent="Merging…";
  const out=await PDFDocument.create();
  for(const f of files){
    const pdf=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
    const pages=await out.copyPages(pdf,pdf.getPageIndices());
    pages.forEach(p=>out.addPage(p));
  }
  const bytes=await out.save();
  const blob=new Blob([bytes],{type:"application/pdf"});
  const url=URL.createObjectURL(blob);
  msg.innerHTML=`Done ✅<br>
    <input id="rename" value="merged"
      style="margin-top:6px;padding:10px;width:100%;
      border:1px solid var(--border);border-radius:10px">
    <button id="dl" style="margin-top:10px;width:100%;
      padding:12px;border-radius:12px;background:var(--primary);
      color:#fff;border:none;font-weight:700">Download PDF</button>`;
  dl.onclick=()=>{
    let n=rename.value.trim()||"merged";
    if(!n.endsWith(".pdf")) n+=".pdf";
    const a=document.createElement("a");a.href=url;a.download=n;a.click();
  };
}
</script>

</body>
</html>
